name: Compile MQL5 Direct
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Official MT5 & MetaEditor
        run: |
          Invoke-WebRequest -Uri "https://mql5.com" -OutFile "mt5setup.exe"
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
          $me = Get-ChildItem -Path "C:\Program Files" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          Copy-Item $me.FullName -Destination ".\metaeditor64.exe"
          New-Item -ItemType Directory -Force -Path "MQL5\Indicators"
          Copy-Item "SessionAndSpreadPro.mq5" -Destination "MQL5\Indicators\SessionAndSpreadPro.mq5"

      - name: Compile Indicator
        run: |
          Start-Process -FilePath ".\metaeditor64.exe" -ArgumentList '/portable /compile:"MQL5\Indicators\SessionAndSpreadPro.mq5" /log:"compile.log"' -Wait
          if (Test-Path "compile.log") { Get-Content "compile.log" -Encoding Unicode }
          if (-not (Test-Path "MQL5\Indicators\SessionAndSpreadPro.ex5")) { exit 1 }

      - name: Upload EX5 File
        uses: actions/upload-artifact@v4
        with:
          name: SessionAndSpreadPro-EX5
          path: MQL5\Indicators\SessionAndSpreadPro.ex5
