name: Compile MQL5 Direct
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Official MetaEditor 64
        run: |
          Invoke-WebRequest -Uri "https://mql5.com" -OutFile "metaeditor64.exe"

      - name: Compile Indicator
        run: |
          Start-Process -FilePath ".\metaeditor64.exe" -ArgumentList '/portable /compile:"SessionAndSpreadPro.mq5" /log:"compile.log"' -Wait
          if (Test-Path "compile.log") { Get-Content "compile.log" }
          if (-not (Test-Path "SessionAndSpreadPro.ex5")) { exit 1 }

      - name: Upload EX5 File
        uses: actions/upload-artifact@v4
        with:
          name: SessionAndSpreadPro-EX5
          path: SessionAndSpreadPro.ex5
